name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "47 8 * * 3"
    - cron: "17 8 1 * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '17 8 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.2.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install -r requirements-dev.txt
      test-command: >-
        python -m pytest -q

  documentation-scribe:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '17 8 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 8 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/benchmark-keeper.yml@v1.2.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install -r requirements-dev.txt
      preflight-command: >-
        python -m pytest -q
      benchmark-command: >-
        python bench/scaling.py --worlds 1,2 --d-model 256 --layers 4 --steps 5 --collective-sizes 65536 --collective-iters 3

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.1.0

  dependency-merger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-merger.yml@v1.1.0
